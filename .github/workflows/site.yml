name: Site

# Checks the data contract and the web app on every pull request,
# and publishes the static site to GitHub Pages on every push to main.
#
# One-time setup by the repository owner:
# Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "data/**"
      - "contracts/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "data/**"
      - "contracts/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate data against the contract
        run: |
          python3 contracts/validate.py data/fixtures
          if [ -f data/processed/tests.json ]; then python3 contracts/validate.py data/processed; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Unit tests
        working-directory: apps/web
        run: npm test

      - name: Build static site
        working-directory: apps/web
        env:
          # Must match the repository name: the site is served from /<repository>/.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
